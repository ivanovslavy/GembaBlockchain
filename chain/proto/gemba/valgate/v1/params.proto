syntax = "proto3";
package gemba.valgate.v1;
import "gogoproto/gogo.proto";
import "cosmos_proto/cosmos.proto";
import "amino/amino.proto";
option go_package = "github.com/ivanovslavy/GembaBlockchain/chain/x/valgate/types";

// Params holds the validator-gate parameters (governance-tunable via MsgUpdateParams).
message Params {
  // min_self_bond is the minimum self-delegation (in agmb base units) required to
  // create a validator. Anti-spam floor; raise/lower it by governance. §5.2.
  string min_self_bond = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // max_self_bond is the MAXIMUM self-delegation (in agmb base units) allowed when
  // CREATING a validator. Anti-domination cap: stops a single party from entering with a
  // huge stake and grabbing an outsized share of consensus power. Governance-tunable;
  // 0/nil means "no cap". Applies only at creation — an existing validator may grow past
  // it via ordinary delegation (e.g. auto-compounding). §5.2.
  string max_self_bond = 2 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // max_daily_bond_increase is the MAXIMUM GMB (agmb) that may be added to ANY already-created
  // validator's bonded stake within one (deterministic, block-time) day — from all sources
  // combined (self-bond, delegations, the founder auto-compound). Anti-domination: a validator
  // can't suddenly jump by a huge amount. Governance-tunable; 0/nil means "no cap". §6 of the
  // regenesis spec.
  string max_daily_bond_increase = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
