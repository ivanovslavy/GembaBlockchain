# GembaBlockchain P2P resilience — added 2026-10-05
#
# WHY. Validator node2 (home line, behind NAT) was downtime-jailed 16 times in 100 days, twice in
# the first four days of October, each costing a 1% slash (125.64 GMB on 2026-10-04). The cause was
# NOT the line going down: Qortal runs on the same box, same line, same NAT and kept all 21 of its
# peers through the 2026-10-04 incident, and the kernel logged no carrier/link/DHCP event. What
# died were exactly node2's three P2P flows to 13.140.139.0/24.
#
# The jail was manufactured by an ASYMMETRY. node2 could still send, so its CometBFT noticed the
# dead peers within ~105 s (ping 60 s + pong timeout 45 s), closed the sockets and re-dialled. The
# three remote validators could NOT get packets out to it, so their MConnection never reached its
# pong timeout and the sockets were left to TCP's own death clock — `tcp_retries2 = 15` ≈ 924 s,
# i.e. 15.4 minutes. Until then every re-dial from node2 was refused with
# `Ignoring inbound connection: duplicate ID<63b04f9b…>` (54,238 refused attempts in 22 minutes on
# 2026-10-04). The chain jails after 50 missed blocks of 100 — about 1.9 minutes. So a ~2-minute
# network disturbance became a 20-minute jail purely because the far side held a dead socket for
# 15 minutes. Restarting node2 cannot help: the node ID stays the same, so the refusals continue.
#
# retries2 = 6 kills a black-holed socket in ~25 s, comfortably inside the 1.9-minute jail window:
# node2's reconnect then succeeds while it is still signing. The cost is that any TCP connection
# surviving more than ~25 s of total packet loss is dropped — on these boxes that is desirable,
# since CometBFT reconnects in seconds and a dropped peer is cheap while a black hole is not.
net.ipv4.tcp_retries2 = 6

# Keepalives: hold NAT/conntrack mappings warm and detect a dead path without waiting two hours.
# Default is 7200 s (2 h), far longer than any home router keeps an idle mapping.
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
