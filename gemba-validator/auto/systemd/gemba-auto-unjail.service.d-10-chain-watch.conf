# Drop-in for gemba-auto-unjail.service — install as
#   /etc/systemd/system/gemba-auto-unjail.service.d/10-chain-watch.conf
#
# Adds the CHAIN-halt check to the watchdog's existing 5-minute timer instead of creating a second
# timer: the two questions ("is my node alive" and "is the chain alive") are answered on the same
# tick, and there is one less unit to forget. The service is Type=oneshot, so a second ExecStart runs
# after the first.
#
# The leading "-" is deliberate: if the chain check fails for any reason it must NOT mark the unjail
# watchdog as failed. The watchdog protects stake; it outranks the monitor.
[Service]
ExecStart=-/usr/local/bin/gemba-chain-watch.sh
